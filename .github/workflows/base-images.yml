name: Base images (GHCR)

# gamend-builder, gamend-runtime and gamend-backup (docker/README.md): what
# core's image and every app built on Gamend start FROM. Called by
# build-and-check.yml before the images built on them, so a push that changes
# both builds the base first; and on its own every week, for Debian's and
# Postgres's security fixes.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Base image (gamend-${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: builder
            tag: elixir-1.20
          - name: runtime
            tag: trixie
          - name: backup
            tag: "18"

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # A pull request from a fork has no token to push with, and nothing is
      # pushed from one anyway.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed from main only. In a call from build-and-check.yml,
      # github.event_name is the caller's event, so a pull request builds the
      # image and pushes nothing.
      - name: Build and (conditionally) push
        uses: docker/build-push-action@v7
        with:
          context: docker/${{ matrix.name }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=base-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.name }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/gamend-${{ matrix.name }}:${{ matrix.tag }}
            ghcr.io/${{ github.repository_owner }}/gamend-${{ matrix.name }}:latest
